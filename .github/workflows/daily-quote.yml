name: Life OS Daily Automation

on:
  schedule:
    # 30 21 UTC = 3:00 AM IST — the only scheduled run
    - cron: '30 21 * * *'
  workflow_dispatch:   # Manual trigger from GitHub UI (useful for testing)

jobs:
  run-life-os:
    name: Life OS Morning Briefing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic requests PyJWT cryptography

      - name: Run morning briefing
        env:
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY:          ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_ID:          ${{ secrets.NOTION_PAGE_ID }}
          GOOGLE_CREDENTIALS:      ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CALENDAR_ID:      ${{ secrets.GOOGLE_CALENDAR_ID }}
          WEEKLY_CHECKLIST_DB_ID:  ${{ secrets.WEEKLY_CHECKLIST_DB_ID }}
          STRATEGIC_GOALS_DB_ID:   ${{ secrets.STRATEGIC_GOALS_DB_ID }}
          DAILY_JOURNAL_DB_ID:     ${{ secrets.DAILY_JOURNAL_DB_ID }}
          AGENT_MEMORY_PAGE_ID:    ${{ secrets.AGENT_MEMORY_PAGE_ID }}
          AGENT_MEMORY_DB_ID:      ${{ secrets.AGENT_MEMORY_DB_ID }}
        run: python morning_run.py
